{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-12 bg-white border border-gray-200 rounded-xl p-8">
    <h1 class="text-2xl font-semibold text-center mb-6">Вход в админку</h1>
    {% if error %}
    <div class="mb-4 px-3 py-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-md">
        {{ error }}
    </div>
    {% endif %}
    <form method="post" action="/admin/login" autocomplete="off" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
            <input type="password" name="password" autofocus required
                   autocomplete="current-password"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black">
        </div>
        <button type="submit"
                class="w-full bg-black text-white py-2 rounded-md hover:opacity-90">
            Войти
        </button>
    </form>
</div>
{% endblock %}
