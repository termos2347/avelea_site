<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Avelea — Натуральная косметика{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 max-w-6xl">
        <!-- Навигация -->
        <nav class="flex flex-wrap items-center justify-between py-4 border-b border-gray-200 mb-6">
            <a href="/" class="text-2xl font-semibold tracking-tight hover:opacity-80">
                avelea
            </a>
            <div class="flex gap-1 sm:gap-2 flex-wrap items-center">
                <a href="/" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-sm sm:text-base">Главная</a>
                <a href="/catalog" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-sm sm:text-base">Каталог</a>
                <a href="/about" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-sm sm:text-base">О нас</a>
                <a href="/cart" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-sm sm:text-base relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="absolute -top-1 -right-1 bg-black text-white text-xs font-medium px-1.5 py-0.5 rounded-full">
                        {{ cart|length if cart else 0 }}
                    </span>
                </a>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="py-6 min-h-[60vh]">
            {% block content %}{% endblock %}
        </main>

        <!-- Футер -->
        <footer class="mt-12 py-8 border-t border-gray-200 text-sm text-gray-600">
            <div class="flex flex-wrap justify-between gap-6">
                <div>
                    <h4 class="font-semibold text-gray-900">avelea</h4>
                    <p>Натуральная косметика для бережного ухода</p>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-900">Контакты</h4>
                    <p><i class="fas fa-phone"></i> +7 (999) 123-45-67</p>
                    <p><i class="fas fa-envelope"></i> info@avelea.ru</p>
                </div>
            </div>
            <div class="mt-4 text-center text-gray-400 text-xs">
                © 2026 avelea. Все права защищены.
            </div>
        </footer>
    </div>
</body>
</html>
