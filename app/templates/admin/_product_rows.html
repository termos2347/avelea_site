{% from "_product_macros.html" import product_row, product_card with context %}

<template data-table-rows>
  {% for p in products %}{{ product_row(p) }}{% endfor %}
</template>

<template data-card-items>
  {% for p in products %}{{ product_card(p) }}{% endfor %}
</template>

<div data-infinite-meta
     data-page="{{ page }}"
     data-total-pages="{{ total_pages }}"
     data-has-next="{{ '1' if page < total_pages else '0' }}"
     hidden></div>
