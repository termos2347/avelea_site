<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Вход в админку — avelea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 max-w-6xl">
        <div class="max-w-sm mx-auto mt-12 bg-white border border-gray-200 rounded-xl p-8">
            <h1 class="text-2xl font-semibold text-center mb-6">Вход в админку</h1>
            {% if error %}
            <div class="mb-4 px-3 py-2 bg-red-50 border border-red-200 text-red-700 text-sm rounded-md">
                {{ error }}
            </div>
            {% endif %}
            <form method="post" action="/admin/login" autocomplete="off" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input type="password" name="password" autofocus required
                           autocomplete="current-password"
                           class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <button type="submit"
                        class="w-full bg-black text-white py-2 rounded-md hover:opacity-90">
                    Войти
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="/" class="text-sm text-gray-500 hover:text-black">
                    <i class="fas fa-arrow-left"></i> На сайт
                </a>
            </div>
        </div>
    </div>
</body>
</html>
