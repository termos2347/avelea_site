<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="view-transition" content="same-origin">
    <title>Вход в админку — avelea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;" hx-boost="true">

    <div id="htmx-progress"></div>

    <div class="adm-login-page">
        <div class="adm-login-card">

            <div class="adm-login-brand">
                avelea <small>admin</small>
            </div>
            <h1 class="adm-login-title">Вход в админку</h1>
            <p class="adm-login-sub">Введите пароль администратора</p>

            {% if error %}
            <div class="adm-alert adm-alert-error">
                <i class="fas fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/admin/login" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <div style="margin-bottom: 1rem;">
                    <label class="adm-label">Пароль</label>
                    <input type="password" name="password" autofocus required
                           autocomplete="current-password"
                           class="adm-input" placeholder="••••••••">
                </div>
                <button type="submit" class="adm-btn adm-btn-primary" style="width: 100%; padding: 0.65rem 1rem;">
                    Войти
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/" style="font-size: 0.85rem; color: var(--adm-muted); text-decoration: none;">
                    <i class="fas fa-arrow-left" style="font-size: 0.7rem;"></i> На сайт
                </a>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
